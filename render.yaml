# Render Blueprint: creates the API. The PostgreSQL database is created separately in the Render dashboard
# (the free plan allows one free database per workspace), and its URL is pasted in as DATABASE_URL.
# Render dashboard -> New -> Blueprint -> pick this repo. The frontend is deployed separately on Vercel (see docs/deployment.md).
# Free plans are for demos: the database expires after 30 days and the API sleeps when idle.
services:
  - type: web
    name: atlas-api
    runtime: docker
    region: oregon            # if you use the Internal Database URL, this must match the database's region
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL     # paste the database's External (or Internal) URL; postgres:// is rewritten to postgresql+psycopg:// by the app
        sync: false
      - key: CORS_ORIGINS     # set to your Vercel URL (no trailing slash) after the frontend is deployed
        sync: false
      - key: EMBEDDINGS_ENABLED
        value: "false"        # the free tier has 512 MB RAM, too little for the embedding model
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
