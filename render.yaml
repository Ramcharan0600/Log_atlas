# Render Blueprint: creates the PostgreSQL database and the API in one step.
# Render dashboard -> New -> Blueprint -> pick this repo. The frontend is deployed separately on Vercel (see docs/deployment.md).
# Free plans are for demos: the database expires after 30 days and the API sleeps when idle.
databases:
  - name: atlas-db
    databaseName: atlas
    user: atlas
    plan: free
    region: oregon

services:
  - type: web
    name: atlas-api
    runtime: docker
    region: oregon            # keep the same region as the database so the internal connection string works
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL     # postgres:// is rewritten to postgresql+psycopg:// by the app
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: CORS_ORIGINS     # set to your Vercel URL (no trailing slash) after the frontend is deployed
        sync: false
      - key: EMBEDDINGS_ENABLED
        value: "false"        # the free tier has 512 MB RAM, too little for the embedding model
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
